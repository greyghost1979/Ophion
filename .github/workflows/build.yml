name: Build Ophion Driver

# Builds the Ophion kernel driver (Ophion.sys) on GitHub Actions using the WDK
# distributed as NuGet packages. The winget/MSI WDK installer is NOT used:
# Microsoft MSI downloads are unreliable (corrupted) on GHA runners.
#
# References:
#   - microsoft/windows-drivers-rs PR #406 (NuGet WDK usage)
#   - mcuee/libusb-win32 workflows (WDK via MSBuild without the WDK VSIX)
#   - MiroKaku/Musa.CoreLite 5a4770c (WDK + MSBuild on GHA)
#   - microsoft/Windows-driver-samples (official NuGet-mode WDK consumption)
#
# How this works:
#   1. VS 2022 Build Tools + VC tools are installed via chocolatey.
#   2. WDK 10.0.26100.2454 + matching Windows SDK are pulled from nuget.org:
#        Microsoft.Windows.WDK.x64      (km headers/libs, build props/targets, WDK tools)
#        Microsoft.Windows.SDK.CPP       (um/shared/ucrt headers, DesignTime UAP props)
#        Microsoft.Windows.SDK.CPP.x64   (um/ucrt x64 import libraries)
#   3. A standard WDK kits layout is materialized at
#        $GITHUB_WORKSPACE/wdk_root/Program Files (x86)/Windows Kits/10/
#      containing Include/, Lib/, build/ (plus bin, DesignTime, tools, CodeAnalysis).
#   4. The KitsRoot10 / SDK InstallationFolder registry keys are pointed at that
#      layout so stock MSBuild resolves WindowsSdkDir from it.
#   5. The WindowsKernelModeDriver10.0 platform toolset (normally delivered by the
#      WDK VSIX / VS WDK component) is created inside the VS Build Tools install:
#      the ImportAfter glue is copied verbatim from the WDK NuGet package and the
#      Toolset.props/Toolset.targets are authored here (modeled on the stock v143
#      toolset + the kit's WindowsDriver props chain).
#   6. Ophion.sln is built with the 64-bit MSBuild; Ophion.sys is uploaded.

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  # WDK QFE version (NuGet package version)
  WDK_VERSION: 10.0.26100.2454
  # Versioned folder inside the kit (build/Include/Lib root)
  KIT_VERSION: 10.0.26100.0

jobs:
  build:
    name: Build Ophion.sys (Release x64)
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # 1. Visual Studio 2022 Build Tools via chocolatey
      # ------------------------------------------------------------------
      - name: Install VS 2022 Build Tools (choco)
        shell: pwsh
        run: |
          Write-Host 'Installing VS 2022 Build Tools with the VC tools workload...'
          choco install visualstudio2022buildtools --yes --no-progress `
            --package-parameters "--quiet --norestart --add Microsoft.VisualStudio.Workload.VCTools"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "choco install failed with exit code $LASTEXITCODE"
            exit 1
          }

          # --- Diagnostics -------------------------------------------------
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $elevated = ([Security.Principal.WindowsPrincipal]$identity).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host "Shell elevated: $elevated"
          $vsRoot  = & $vswhere -latest -products Microsoft.VisualStudio.Product.BuildTools -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsRoot) { Write-Error 'VS 2022 Build Tools not found after choco install'; exit 1 }
          Write-Host "VS Build Tools at: $vsRoot"
          Write-Host "--- instance top-level directories:"
          Get-ChildItem $vsRoot -Directory -ErrorAction SilentlyContinue | ForEach-Object { Write-Host "  $($_.Name)" }
          Write-Host "--- installed components (vswhere -include packages):"
          & $vswhere -latest -products Microsoft.VisualStudio.Product.BuildTools -format json -include packages |
            ConvertFrom-Json | ForEach-Object { $_.packages | Where-Object { $_.type -eq 'Workload' -or $_.id -like '*VC.Tools*' } } |
            ForEach-Object { Write-Host "  $($_.id)" }
          Write-Host "--- installer log tails:"
          Get-ChildItem "$env:TEMP\dd_*.log" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime | Select-Object -Last 4 |
            ForEach-Object {
              Write-Host "=== $($_.Name) (last 15 lines):"
              Get-Content $_.FullName -Tail 15 | ForEach-Object { Write-Host "  $_" }
            }

          # --- Verify the MSVC compiler actually landed ---------------------
          # Depending on the choco / chocolatey-visualstudio.extension versions,
          # the package parameters can fail to reach the VS installer, leaving
          # only the base shell (VCToolsInstallDir undefined -> cl.exe/ml64.exe
          # not found). If that happens, run the VS bootstrapper directly.
          $cl = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" -ErrorAction SilentlyContinue
          if (-not $cl) {
            Write-Host 'MSVC tools missing after choco install - running the VS bootstrapper directly...'
            $bootstrapper = Join-Path $env:RUNNER_TEMP 'vs_buildtools.exe'
            curl.exe -sSL -o $bootstrapper 'https://aka.ms/vs/17/release/vs_buildtools.exe'
            if ($LASTEXITCODE -ne 0) { Write-Error 'failed to download vs_buildtools.exe'; exit 1 }
            & $bootstrapper modify --installPath $vsRoot `
              --add Microsoft.VisualStudio.Workload.VCTools `
              --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              --quiet --norestart --wait --nocache
            $vsExit = $LASTEXITCODE
            Write-Host "vs_buildtools.exe modify exit code: $vsExit"
            # 0 = success, 3010 = success + reboot, 740 = elevation required (should not happen)
            if ($vsExit -ne 0 -and $vsExit -ne 3010) {
              Write-Error "VS bootstrapper modify failed with exit code $vsExit"
              exit 1
            }
            $cl = Get-ChildItem "$vsRoot\VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe" -ErrorAction SilentlyContinue
            if (-not $cl) {
              Write-Host '--- post-modify installer log tails:'
              Get-ChildItem "$env:TEMP\dd_*.log" -ErrorAction SilentlyContinue |
                Sort-Object LastWriteTime | Select-Object -Last 4 |
                ForEach-Object {
                  Write-Host "=== $($_.Name) (last 15 lines):"
                  Get-Content $_.FullName -Tail 15 | ForEach-Object { Write-Host "  $_" }
                }
              Write-Error 'MSVC tools still missing after direct VS bootstrapper modify'
              exit 1
            }
          }
          Write-Host "MSVC compiler: $($cl.FullName)"

      # ------------------------------------------------------------------
      # 2. WDK + SDK via NuGet (NOT winget / MSI)
      # ------------------------------------------------------------------
      - name: Setup NuGet
        uses: nuget/setup-nuget@v2
        with:
          nuget-version: latest

      - name: Cache WDK/SDK NuGet packages
        uses: actions/cache@v4
        with:
          path: packages
          key: wdk-nuget-${{ env.WDK_VERSION }}

      - name: Download WDK and SDK NuGet packages
        shell: pwsh
        run: |
          $pkgs = Join-Path $env:GITHUB_WORKSPACE 'packages'
          New-Item -ItemType Directory -Force -Path $pkgs | Out-Null

          nuget install Microsoft.Windows.SDK.CPP     -Version $env:WDK_VERSION -OutputDirectory $pkgs -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit 1 }
          nuget install Microsoft.Windows.SDK.CPP.x64 -Version $env:WDK_VERSION -OutputDirectory $pkgs -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit 1 }
          nuget install Microsoft.Windows.WDK.x64     -Version $env:WDK_VERSION -OutputDirectory $pkgs -NonInteractive
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ------------------------------------------------------------------
      # 3. Standard WDK layout at wdk_root/Program Files (x86)/Windows Kits/10/
      # ------------------------------------------------------------------
      - name: Create standard WDK layout from NuGet packages
        shell: pwsh
        run: |
          $kits   = Join-Path $env:GITHUB_WORKSPACE 'wdk_root\Program Files (x86)\Windows Kits\10'
          $wdk    = Join-Path $env:GITHUB_WORKSPACE "packages\Microsoft.Windows.WDK.x64.$env:WDK_VERSION\c"
          $sdk    = Join-Path $env:GITHUB_WORKSPACE "packages\Microsoft.Windows.SDK.CPP.$env:WDK_VERSION\c"
          $sdkx64 = Join-Path $env:GITHUB_WORKSPACE "packages\Microsoft.Windows.SDK.CPP.x64.$env:WDK_VERSION\c"
          $kit    = $env:KIT_VERSION

          foreach ($p in @($wdk, $sdk, $sdkx64)) {
            if (-not (Test-Path $p)) { Write-Error "Package content not found: $p"; exit 1 }
          }

          New-Item -ItemType Directory -Force -Path $kits | Out-Null

          # robocopy merges directory trees; exit codes 0-7 are success
          function Copy-Tree([string]$src, [string]$dst) {
            robocopy $src $dst /E /NFL /NDL /NJH /NJS /NP | Out-Null
            if ($LASTEXITCODE -ge 8) { Write-Error "robocopy failed ($LASTEXITCODE): $src -> $dst"; exit 1 }
            $global:LASTEXITCODE = 0
          }

          # --- Include (km/um/shared from the WDK; um/shared/ucrt/cppwinrt/winrt from the SDK) ---
          Copy-Tree "$wdk\Include"    "$kits\Include"
          Copy-Tree "$sdk\Include"    "$kits\Include"

          # --- Lib (km + um from the WDK; um/ucrt x64 import libs from the SDK) ---
          Copy-Tree "$wdk\Lib"        "$kits\Lib"
          Copy-Tree "$sdkx64\um"      "$kits\Lib\$kit\um"
          Copy-Tree "$sdkx64\ucrt"    "$kits\Lib\$kit\ucrt"

          # --- build (WindowsDriver.*.props/.targets + Microsoft.DriverKit.Build.Tasks.17.0.dll) ---
          Copy-Tree "$wdk\build"      "$kits\build"

          # --- bin (stampinf/Inf2Cat from the WDK; signtool/makecat from the SDK) ---
          Copy-Tree "$wdk\bin"        "$kits\bin"
          Copy-Tree "$sdk\bin\$kit"   "$kits\bin\$kit"

          # --- DesignTime (WDK.props / UAP.props / uCRT.props) ---
          Copy-Tree "$wdk\DesignTime" "$kits\DesignTime"
          Copy-Tree "$sdk\DesignTime" "$kits\DesignTime"

          # --- tools, CodeAnalysis, certificates, SDKManifest.xml ---
          Copy-Tree "$wdk\tools"      "$kits\tools"
          Copy-Tree "$wdk\CodeAnalysis"   "$kits\CodeAnalysis"
          Copy-Tree "$wdk\CrossCertificates" "$kits\CrossCertificates"
          Copy-Tree "$wdk\CoreSystem"     "$kits\CoreSystem"
          Copy-Item "$sdk\SDKManifest.xml" "$kits\SDKManifest.xml" -Force

          # Fail fast if anything essential is missing
          $probes = @(
            "$kits\Include\$kit\km\ntddk.h",
            "$kits\Include\$kit\shared\ntdef.h",
            "$kits\Include\$kit\shared\sdkddkver.h",
            "$kits\Lib\$kit\km\x64\ntoskrnl.lib",
            "$kits\Lib\$kit\um\x64\Gdi32.Lib",
            "$kits\build\$kit\WindowsDriver.KernelMode.props",
            "$kits\build\$kit\WindowsDriver.Default.props",
            "$kits\build\$kit\bin\Microsoft.DriverKit.Build.Tasks.17.0.dll",
            "$kits\bin\$kit\x64\stampinf.exe",
            "$kits\bin\$kit\x86\signtool.exe",
            "$kits\DesignTime\CommonConfiguration\Neutral\WDK\$kit\WDK.props",
            "$kits\DesignTime\CommonConfiguration\Neutral\UAP\$kit\UAP.props",
            "$kits\DesignTime\CommonConfiguration\Neutral\uCRT.props",
            "$kits\SDKManifest.xml"
          )
          foreach ($probe in $probes) {
            if (-not (Test-Path $probe)) { Write-Error "Standard WDK layout incomplete: missing $probe"; exit 1 }
          }

          # WDKContentRoot for the build step (used by the platform toolset glue)
          "WDKContentRoot=$kits\" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "WDK layout ready at $kits"

      # ------------------------------------------------------------------
      # 4. Registry keys: make MSBuild resolve WindowsSdkDir from wdk_root
      # ------------------------------------------------------------------
      - name: Point Windows Kits registry at the WDK layout
        shell: pwsh
        run: |
          $kits = Join-Path $env:GITHUB_WORKSPACE 'wdk_root\Program Files (x86)\Windows Kits\10'
          if (-not $kits.EndsWith('\')) { $kits = "$kits\" }

          # KitsRoot10 (read by Microsoft.Cpp.WindowsSDK.props and uCRT.props).
          # Set-ItemProperty is used instead of reg add to avoid the
          # trailing-backslash argument quoting hazard.
          $roots = @(
            'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows Kits\Installed Roots'
          )
          foreach ($root in $roots) {
            New-Item -Path $root -Force | Out-Null
            Set-ItemProperty -Path $root -Name KitsRoot10 -Value $kits -Type String
          }

          # Windows SDK v10.0 installation folder (read by Microsoft.Cpp.WindowsSDK.props)
          $sdkKeys = @(
            'HKLM:\SOFTWARE\Microsoft\Microsoft SDKs\Windows\v10.0',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Microsoft SDKs\Windows\v10.0'
          )
          foreach ($key in $sdkKeys) {
            New-Item -Path $key -Force | Out-Null
            Set-ItemProperty -Path $key -Name InstallationFolder -Value $kits -Type String
          }

          Write-Host "KitsRoot10 -> $kits"

      # ------------------------------------------------------------------
      # 5. WindowsKernelModeDriver10.0 platform toolset inside VS Build Tools
      #    (the glue the WDK VSIX would normally install)
      # ------------------------------------------------------------------
      - name: Install WindowsKernelModeDriver10.0 toolset into VS Build Tools
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot  = & $vswhere -latest -products Microsoft.VisualStudio.Product.BuildTools -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsRoot) { Write-Error 'VS 2022 Build Tools not found'; exit 1 }
          Write-Host "VS Build Tools: $vsRoot"

          $vct  = Join-Path $vsRoot 'MSBuild\Microsoft\VC\v170'
          $wdk  = Join-Path $env:GITHUB_WORKSPACE "packages\Microsoft.Windows.WDK.x64.$env:WDK_VERSION\c"
          $kit  = $env:KIT_VERSION
          $plat = 'x64'

          if (-not (Test-Path "$vct\Platforms\$plat\PlatformToolsets\v143\Toolset.props")) {
            Write-Error "VC v170 platform targets not found under $vct (was the VCTools workload installed?)"
            exit 1
          }

          # a) ImportAfter glue, taken verbatim from the WDK NuGet package.
          #    These are the files the VS WDK component would drop into the VC targets
          #    tree. WDK.x64.WindowsKernelModeDriver.Platform.props pulls in the
          #    WindowsDriver.*.props chain from the kit.
          $importAfter = "$vct\Platforms\$plat\ImportAfter"
          New-Item -ItemType Directory -Force -Path $importAfter | Out-Null
          Copy-Item "$wdk\build\$kit\$plat\ImportAfter\*" $importAfter -Force

          # b) The platform toolset itself.
          $tsDir = "$vct\Platforms\$plat\PlatformToolsets\WindowsKernelModeDriver10.0"
          New-Item -ItemType Directory -Force -Path $tsDir | Out-Null

          # Toolset.props: modeled on the stock v143 Toolset.props. After the stock
          # MSVC/WindowsSDK props have resolved WindowsSdkDir/TargetPlatformVersion,
          # it imports the WDK kit props (DDKPlatform, KM_IncludePath, WDKBinRoot...)
          # and WindowsDriver.Default.props.
          $toolsetProps = @'
          <?xml version="1.0" encoding="utf-8"?>
          <Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <Import Project="$(MSBuildThisFileDirectory)ImportBefore\*.props" Condition="Exists('$(MSBuildThisFileDirectory)ImportBefore')" />
          
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.MSVC.Toolset.x64.props" />
          
            <PropertyGroup>
              <IsKernelModeToolset>true</IsKernelModeToolset>
              <WDKContentRoot Condition="'$(WDKContentRoot)' == ''">$(WindowsSdkDir)</WDKContentRoot>
              <WDKContentRoot Condition="!HasTrailingSlash('$(WDKContentRoot)')">$(WDKContentRoot)\</WDKContentRoot>
              <WDKBuildFolder Condition="'$(WDKBuildFolder)' == '' and Exists('$(WDKContentRoot)build\$(TargetPlatformVersion)')">$(TargetPlatformVersion)</WDKBuildFolder>
            </PropertyGroup>
          
            <Import Condition="Exists('$(WDKContentRoot)build\$(WDKBuildFolder)\$(Platform)\WindowsKernelModeDriver\WDK.$(Platform).WindowsKernelModeDriver.props')"
                    Project="$(WDKContentRoot)build\$(WDKBuildFolder)\$(Platform)\WindowsKernelModeDriver\WDK.$(Platform).WindowsKernelModeDriver.props" />
            <Import Condition="Exists('$(WDKContentRoot)DesignTime\CommonConfiguration\Neutral\WDK\$(TargetPlatformVersion)\WDK.props')"
                    Project="$(WDKContentRoot)DesignTime\CommonConfiguration\Neutral\WDK\$(TargetPlatformVersion)\WDK.props" />
            <Import Condition="Exists('$(WDKContentRoot)build\$(WDKBuildFolder)\WindowsDriver.Default.props')"
                    Project="$(WDKContentRoot)build\$(WDKBuildFolder)\WindowsDriver.Default.props" />
          
            <Import Project="$(MSBuildThisFileDirectory)ImportAfter\*.props" Condition="Exists('$(MSBuildThisFileDirectory)ImportAfter')" />
            <Import Project="$(_PlatformFolder)Platform.Common.props" />
          </Project>
          '@
          Set-Content -Path (Join-Path $tsDir 'Toolset.props') -Value $toolsetProps -Encoding ASCII

          # Toolset.targets: stock v143 Toolset.targets plus the WDK
          # WindowsDriver.Common.targets (driver build tasks, MASM integration, ...).
          $toolsetTargets = @'
          <?xml version="1.0" encoding="utf-8"?>
          <Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003">
            <Import Project="$(MSBuildThisFileDirectory)ImportBefore\*.targets" Condition="Exists('$(MSBuildThisFileDirectory)ImportBefore')" />
          
            <Import Project="$(VCTargetsPath)\Microsoft.CppCommon.targets" />
            <Import Project="$(VCTargetsPath)\Microsoft.Cpp.WindowsSDK.targets" />
          
            <Import Condition="Exists('$(WDKContentRoot)build\$(WDKBuildFolder)\WindowsDriver.Common.targets')"
                    Project="$(WDKContentRoot)build\$(WDKBuildFolder)\WindowsDriver.Common.targets" />
          
            <Import Project="$(MSBuildThisFileDirectory)ImportAfter\*.targets" Condition="Exists('$(MSBuildThisFileDirectory)ImportAfter')" />
          </Project>
          '@
          Set-Content -Path (Join-Path $tsDir 'Toolset.targets') -Value $toolsetTargets -Encoding ASCII

          Write-Host "WindowsKernelModeDriver10.0 toolset installed at $tsDir"

      # ------------------------------------------------------------------
      # 6. Build Ophion.sln
      # ------------------------------------------------------------------
      - name: Build Ophion.sln
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsRoot  = & $vswhere -latest -products Microsoft.VisualStudio.Product.BuildTools -requires Microsoft.Component.MSBuild -property installationPath
          # 64-bit MSBuild is required: WindowsDriver.Common.targets derives tool
          # paths from the MSBuild process architecture (stampinf/TRK0005 issues
          # under the 32-bit host).
          $msbuild = Join-Path $vsRoot 'MSBuild\Current\Bin\amd64\MSBuild.exe'
          if (-not (Test-Path $msbuild)) { Write-Error "MSBuild not found: $msbuild"; exit 1 }

          Write-Host "WDKContentRoot = $env:WDKContentRoot"

          & $msbuild (Join-Path $env:GITHUB_WORKSPACE 'Ophion.sln') `
            /t:Build `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:SignMode=Off `
            /m /nr:false /v:minimal /nologo
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # ------------------------------------------------------------------
      # 7. Upload Ophion.sys
      # ------------------------------------------------------------------
      - name: Upload Ophion.sys artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ophion-driver-x64
          path: |
            build/bin/Release/Ophion.sys
            build/bin/Release/Ophion.pdb
          if-no-files-found: error
